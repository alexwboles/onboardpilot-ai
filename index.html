<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OnboardPilot AI — Employee Onboarding Checklists</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <div class="brandmark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h13"/><path d="M13 5l7 7-7 7"/><path d="M22 5v14"/></svg>
    </div>
    <div>
      <h1 class="brand">OnboardPilot <span>AI</span></h1>
      <p class="tagline">Every new hire's journey, from offer letter to fully ramped.</p>
    </div>
  </div>
  <nav class="nav" aria-label="Views">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="hires">New hire</button>
    <button data-view="buddies">Buddies</button>
    <button data-view="roles">Roles</button>
    <button data-view="settings">Settings</button>
  </nav>
</header>
<main class="wrap">
  <section id="view-dashboard" class="view active"></section>
  <section id="view-hires" class="view"></section>
  <section id="view-buddies" class="view"></section>
  <section id="view-roles" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>
<footer class="foot">OnboardPilot AI · all data stays in this browser · optional AI welcome drafts need your own OpenAI key</footer>
<script src="js/logic.js"></script>
<script src="js/app.js"></script>
</body>
</html>
